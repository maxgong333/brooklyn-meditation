<svg width="100%" viewBox="0 0 680 320" role="img" xmlns="http://www.w3.org/2000/svg">
<title>How It Works — Four Steps to Inner Clarity</title>
<desc>Recall, Reflect, Release, Return</desc>

<!-- Background -->
<rect width="680" height="320" fill="#F7F6F2" rx="12"/>

<!-- ===== CARD 1: Recall — Sage Green ===== -->
<rect x="20" y="24" width="145" height="272" rx="14" fill="#D8E3D8" stroke="#8FAF8F" stroke-width="1.5" stroke-dasharray="5 3"/>

<!-- Book illustration -->
<g transform="translate(93,88)" stroke="#5A7A5A" stroke-linecap="round" stroke-linejoin="round">
  <rect x="-22" y="-28" width="44" height="56" rx="3" fill="#B8CCB8" stroke-width="1.4"/>
  <rect x="-22" y="-28" width="8" height="56" rx="3 0 0 3" fill="#8FAF8F" stroke-width="1.4"/>
  <line x1="-10" y1="-18" x2="18" y2="-18" stroke-width="1" stroke="#5A7A5A" opacity="0.5"/>
  <line x1="-10" y1="-10" x2="18" y2="-10" stroke-width="1" stroke="#5A7A5A" opacity="0.5"/>
  <line x1="-10" y1="-2"  x2="18" y2="-2"  stroke-width="1" stroke="#5A7A5A" opacity="0.5"/>
  <line x1="-10" y1="6"   x2="18" y2="6"   stroke-width="1" stroke="#5A7A5A" opacity="0.5"/>
  <line x1="-10" y1="14"  x2="14" y2="14"  stroke-width="1" stroke="#5A7A5A" opacity="0.5"/>
  <path d="M 10,-28 L 10,-10 L 6,-14 L 2,-10 L 2,-28" fill="#C8A88A" stroke="#A07850" stroke-width="1"/>
</g>

<text x="92" y="158" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#3D5C3D" font-style="italic">01</text>
<text x="92" y="178" text-anchor="middle" font-family="Georgia,serif" font-size="17" fill="#2A3D2A" font-weight="bold">Recall</text>
<line x1="62" y1="188" x2="122" y2="188" stroke="#8FAF8F" stroke-width="1.2"/>
<text x="92" y="206" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#4A6A4A" font-style="italic">Bring awareness</text>
<text x="92" y="221" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#4A6A4A" font-style="italic">to the memories</text>
<text x="92" y="236" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#4A6A4A" font-style="italic">that shaped you.</text>

<!-- ===== CARD 2: Reflect — Lavender ===== -->
<rect x="178" y="24" width="145" height="272" rx="14" fill="#DDD8E8" stroke="#9A8AB8" stroke-width="1.5" stroke-dasharray="5 3"/>

<!-- Eye illustration -->
<g transform="translate(251,88)" stroke="#5A4A8A" stroke-linecap="round" stroke-linejoin="round">
  <path d="M -30,0 Q -10,-28 0,-28 Q 10,-28 30,0 Q 10,28 0,28 Q -10,28 -30,0" fill="#C8C0E0" stroke-width="1.4"/>
  <circle cx="0" cy="0" r="14" fill="#9A8AB8" stroke-width="1.2"/>
  <circle cx="0" cy="0" r="7" fill="#2A1A4A" stroke="none"/>
  <circle cx="4" cy="-4" r="3" fill="white" stroke="none" opacity="0.8"/>
  <line x1="-18" y1="-18" x2="-14" y2="-24" stroke-width="1.2"/>
  <line x1="-6"  y1="-26" x2="-4"  y2="-32" stroke-width="1.2"/>
  <line x1="6"   y1="-26" x2="8"   y2="-32" stroke-width="1.2"/>
  <line x1="18"  y1="-18" x2="22"  y2="-24" stroke-width="1.2"/>
</g>

<text x="251" y="158" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#5A4A8A" font-style="italic">02</text>
<text x="251" y="178" text-anchor="middle" font-family="Georgia,serif" font-size="17" fill="#2A1A4A" font-weight="bold">Reflect</text>
<line x1="221" y1="188" x2="281" y2="188" stroke="#9A8AB8" stroke-width="1.2"/>
<text x="251" y="206" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#5A4A7A" font-style="italic">See thoughts clearly</text>
<text x="251" y="221" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#5A4A7A" font-style="italic">— not your true</text>
<text x="251" y="236" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#5A4A7A" font-style="italic">identity.</text>

<!-- ===== CARD 3: Release — Peach ===== -->
<rect x="336" y="24" width="145" height="272" rx="14" fill="#EDD8CC" stroke="#C89878" stroke-width="1.5" stroke-dasharray="5 3"/>

<!-- Leaves / Wind illustration -->
<g transform="translate(409,88)" stroke="#A06040" stroke-linecap="round" stroke-linejoin="round">
  <path d="M -12,-20 Q -4,-36 6,-28 Q 14,-18 0,-10 Q -14,-4 -12,-20" fill="#D4A880" stroke-width="1.3"/>
  <line x1="-4" y1="-28" x2="0" y2="-10" stroke-width="0.8" stroke="#A06040"/>
  <path d="M -24,4 Q -8,-8 2,4 Q 6,14 -10,18 Q -26,18 -24,4" fill="#C89060" stroke-width="1.3"/>
  <line x1="-8" y1="-6" x2="-10" y2="18" stroke-width="0.8" stroke="#A06040"/>
  <path d="M 4,0 Q 18,-10 24,4 Q 26,16 12,18 Q 0,18 4,0" fill="#E0B890" stroke-width="1.3"/>
  <line x1="18" y1="-8" x2="12" y2="18" stroke-width="0.8" stroke="#A06040"/>
  <path d="M -28,-6 Q -18,-10 -6,-6" fill="none" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>
  <path d="M -20,14 Q -8,10 6,14" fill="none" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>
  <path d="M 8,-14 Q 20,-18 30,-14" fill="none" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>
</g>

<text x="409" y="158" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#A06040" font-style="italic">03</text>
<text x="409" y="178" text-anchor="middle" font-family="Georgia,serif" font-size="17" fill="#5A2810" font-weight="bold">Release</text>
<line x1="379" y1="188" x2="439" y2="188" stroke="#C89878" stroke-width="1.2"/>
<text x="409" y="206" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#8A5030" font-style="italic">Let go of patterns</text>
<text x="409" y="221" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#8A5030" font-style="italic">that create stress</text>
<text x="409" y="236" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#8A5030" font-style="italic">and limit.</text>

<!-- ===== CARD 4: Return — Teal ===== -->
<rect x="494" y="24" width="145" height="272" rx="14" fill="#C8E0DC" stroke="#6AA098" stroke-width="1.5" stroke-dasharray="5 3"/>

<!-- Lotus illustration -->
<g transform="translate(567,88)" stroke="#38786E" stroke-linecap="round" stroke-linejoin="round">
  <path d="M -28,20 Q -14,16 0,20 Q 14,16 28,20" fill="none" stroke-width="1" opacity="0.5"/>
  <path d="M -22,28 Q -11,24 0,28 Q 11,24 22,28" fill="none" stroke-width="1" opacity="0.4"/>
  <path d="M -18,18 Q -24,-4 -14,-20 Q -6,-6 -10,18" fill="#9CCCC4" stroke-width="1.2" opacity="0.6"/>
  <path d="M 18,18 Q 24,-4 14,-20 Q 6,-6 10,18" fill="#9CCCC4" stroke-width="1.2" opacity="0.6"/>
  <path d="M -10,18 Q -18,-10 -4,-26 Q 2,-10 -2,18" fill="#B0D8D0" stroke-width="1.2"/>
  <path d="M 10,18 Q 18,-10 4,-26 Q -2,-10 2,18" fill="#B0D8D0" stroke-width="1.2"/>
  <path d="M -6,18 Q -4,-28 0,-32 Q 4,-28 6,18" fill="#C8EAE4" stroke-width="1.3"/>
  <circle cx="0" cy="8" r="3" fill="#6AA098" stroke-width="1"/>
  <circle cx="-6" cy="14" r="2" fill="#6AA098" stroke-width="0.8"/>
  <circle cx="6" cy="14" r="2" fill="#6AA098" stroke-width="0.8"/>
</g>

<text x="567" y="158" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#38786E" font-style="italic">04</text>
<text x="567" y="178" text-anchor="middle" font-family="Georgia,serif" font-size="17" fill="#1A4A44" font-weight="bold">Return</text>
<line x1="537" y1="188" x2="597" y2="188" stroke="#6AA098" stroke-width="1.2"/>
<text x="567" y="206" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#38786E" font-style="italic">Discover clarity,</text>
<text x="567" y="221" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#38786E" font-style="italic">peace, and your</text>
<text x="567" y="236" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#38786E" font-style="italic">true nature.</text>

<!-- Connecting arrows between cards -->
<g stroke="#9AABA0" fill="#9AABA0" stroke-width="1.2">
  <line x1="166" y1="160" x2="176" y2="160"/>
  <polygon points="176,157 182,160 176,163"/>
  <line x1="324" y1="160" x2="334" y2="160"/>
  <polygon points="334,157 340,160 334,163"/>
  <line x1="482" y1="160" x2="492" y2="160"/>
  <polygon points="492,157 498,160 492,163"/>
</g>

</svg>
